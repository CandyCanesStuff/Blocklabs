<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlockLabs</title>
<style>
  :root {
    --green: #07bb76;
    --green-dark: #058a57;
    --ink: #08323f;
    --muted: #4b6a73;
    --sky: #0a9bff;
    --sun: #ffd23f;
    --coral: #ff6f61;
    --paper: #f3faf6;
    --line: #cfe4da;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 80px; }
  html, body { margin: 0; }
  body { font-family: "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif; color: var(--ink); background: var(--green); line-height: 1.5; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
  .wrap { width: min(1120px, 100% - 32px); margin-inline: auto; }

  header { position: sticky; top: 0; z-index: 10; background: var(--green); }
  header .wrap { display: flex; align-items: center; gap: 24px; padding: 6px 0; }
  .logo img { display: block; width: 170px; height: auto; }
  nav { display: flex; gap: 4px; }
  nav a { color: #fff; text-decoration: none; font-size: 16px; padding: 8px 14px; border-radius: 10px; }
  nav a:hover { background: #ffffff2b; }
  nav a[aria-current="page"] { background: var(--green-dark); }
  .auth { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .auth a { text-decoration: none; font-size: 15px; padding: 9px 16px; border-radius: 10px; }
  .login { color: #fff; }
  .login:hover { text-decoration: underline; }
  .signup { background: var(--ink); color: #fff; box-shadow: 0 4px 0 #021d25; }
  .signup:active { transform: translateY(3px); box-shadow: 0 1px 0 #021d25; }

  main { min-height: 60vh; background: #fff; }

  footer { background: var(--green); color: #fff; padding: 22px 0 26px; }
  footer a { color: #fff; margin-right: 24px; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer p { margin: 0; }

  @media (max-width: 760px) {
    .logo img { width: 120px; }
    header .wrap { gap: 8px; flex-wrap: wrap; }
    nav a { padding: 6px 10px; font-size: 14px; }
    .login { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; }  }
</style>
</head>
